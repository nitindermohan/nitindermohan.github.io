name: Generate Thumbnails

on:
  pull_request:
    branches:
      - master
    paths:
      - 'documents/**/pubs/*.pdf'

jobs:
  thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Generate missing thumbnails
        id: generate
        run: |
          generated=""
          count=0

          # Find all PDFs in documents/*/pubs/ that don't have a corresponding PNG
          for pdf in $(find documents -path "*/pubs/*.pdf" -type f); do
            png="${pdf%.pdf}.png"
            if [ ! -f "$png" ]; then
              echo "Generating thumbnail for: $pdf"
              gs -dSAFER -dNOPAUSE -dBATCH -sDEVICE=png16m \
                -dTextAlphaBits=4 -dGraphicsAlphaBits=4 \
                -r300 -dDownScaleFactor=4 \
                -dFirstPage=1 -dLastPage=1 \
                -sOutputFile="$png" "$pdf" 2>/dev/null

              if [ -f "$png" ]; then
                generated="${generated}- \`$png\`"$'\n'
                count=$((count + 1))
                echo "Generated: $png"
              else
                echo "Failed to generate thumbnail for: $pdf"
              fi
            fi
          done

          echo "count=$count" >> $GITHUB_OUTPUT
          if [ $count -gt 0 ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "generated<<EOF" >> $GITHUB_OUTPUT
            echo "$generated" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated thumbnails
        if: steps.generate.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add documents/**/pubs/*.png
          git commit -m "auto: generate thumbnails for ${{ steps.generate.outputs.count }} new PDF(s)"
          git push

      - name: Comment on PR
        if: steps.generate.outputs.has_new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Thumbnails Generated\n\nAutomatically generated ${{ steps.generate.outputs.count }} thumbnail(s):\n\n${{ steps.generate.outputs.generated }}\n\n<sub>Generated by GitHub Actions</sub>`
            });
