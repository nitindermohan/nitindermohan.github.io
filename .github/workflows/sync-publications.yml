name: Sync Publications

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
  repository_dispatch:
    types: [publications-updated]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal website
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GH_TOKEN }}

      - name: Checkout lab website
        uses: actions/checkout@v4
        with:
          repository: spear-lab/lab-website
          path: lab-website
          token: ${{ secrets.LAB_GH_TOKEN }}

      - name: Checkout automation scripts
        uses: actions/checkout@v4
        with:
          repository: nitindermohan/claude-playground
          path: automation
          sparse-checkout: mac-automation/automation/scripts
          token: ${{ secrets.PERSONAL_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run publication diff
        id: diff
        run: |
          result=$(node automation/mac-automation/automation/scripts/pub-diff.js \
            --bib lab-website/content/publications/publications.bib \
            --html index.html \
            --json)

          missing=$(echo "$result" | jq -r '.summary.missingFromPersonal')

          if [ "$missing" = "0" ]; then
            echo "in_sync=true" >> $GITHUB_OUTPUT
            echo "Publications are in sync"
          else
            echo "in_sync=false" >> $GITHUB_OUTPUT
            echo "diff_count=$missing" >> $GITHUB_OUTPUT
            echo "Found $missing publications to sync"
          fi

      - name: Generate publications HTML
        if: steps.diff.outputs.in_sync != 'true'
        run: |
          node automation/mac-automation/automation/scripts/bibtex-to-personal-html.js \
            --bib lab-website/content/publications/publications.bib \
            --out /tmp/pubs.html

      - name: Inject into index.html
        if: steps.diff.outputs.in_sync != 'true'
        run: |
          node automation/mac-automation/automation/scripts/inject-section.js \
            --file index.html \
            --section PUBLICATIONS \
            --content /tmp/pubs.html \
            --backup

      - name: Copy missing assets from lab website
        if: steps.diff.outputs.in_sync != 'true'
        run: |
          for year_dir in lab-website/public/papers/*/; do
            year=$(basename "$year_dir")
            mkdir -p "documents/${year}/pubs"
            for pdf in "$year_dir"*.pdf; do
              [ -f "$pdf" ] || continue
              dest="documents/${year}/pubs/$(basename "$pdf")"
              if [ ! -f "$dest" ]; then
                cp "$pdf" "$dest"
                echo "Copied $dest"
              fi
            done
          done

          for year_dir in lab-website/public/images/publications/*/; do
            year=$(basename "$year_dir")
            mkdir -p "documents/${year}/pubs"
            for img in "$year_dir"*.png "$year_dir"*.jpg; do
              [ -f "$img" ] || continue
              dest="documents/${year}/pubs/$(basename "$img")"
              if [ ! -f "$dest" ]; then
                cp "$img" "$dest"
                echo "Copied $dest"
              fi
            done
          done

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git diff --cached --stat
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PERSONAL_GH_TOKEN }}
          branch: auto-sync/publications
          delete-branch: true
          title: 'Sync publications from lab website'
          labels: auto-sync
          body: |
            ## Publication Sync

            Automated sync from [spear-lab/lab-website](https://github.com/spear-lab/lab-website).

            **Changes:** ${{ steps.diff.outputs.diff_count }} publication(s) synced.

            Please review the generated HTML and verify rendering before merging.

            <sub>Generated by GitHub Actions</sub>
          commit-message: 'sync: update publications from lab website'
