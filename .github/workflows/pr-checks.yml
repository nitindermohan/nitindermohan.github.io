name: PR Checks

on:
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check referenced PDFs exist
        id: check-pdfs
        run: |
          echo "Checking PDF references..."
          missing=""

          # Extract PDF paths from index.html (href="documents/..." for PDFs)
          pdf_refs=$(grep -oP 'href="(documents/[^"]+\.pdf)"' index.html | grep -oP 'documents/[^"]+\.pdf' | sort -u)

          for pdf in $pdf_refs; do
            if [ ! -f "$pdf" ]; then
              missing="${missing}- \`$pdf\`"$'\n'
              echo "Missing: $pdf"
            fi
          done

          if [ -n "$missing" ]; then
            echo "has_missing_pdfs=true" >> $GITHUB_OUTPUT
            echo "missing_pdfs<<EOF" >> $GITHUB_OUTPUT
            echo "$missing" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_missing_pdfs=false" >> $GITHUB_OUTPUT
            echo "All PDF references valid"
          fi

      - name: Check referenced images exist
        id: check-images
        run: |
          echo "Checking image references..."
          missing=""

          # Extract image paths from index.html (src="documents/...png" and src="/images/...")
          img_refs=$(grep -oP 'src="(documents/[^"]+\.(png|jpg|jpeg))"' index.html | grep -oP 'documents/[^"]+\.(png|jpg|jpeg)' | sort -u)

          for img in $img_refs; do
            if [ ! -f "$img" ]; then
              missing="${missing}- \`$img\`"$'\n'
              echo "Missing: $img"
            fi
          done

          if [ -n "$missing" ]; then
            echo "has_missing_images=true" >> $GITHUB_OUTPUT
            echo "missing_images<<EOF" >> $GITHUB_OUTPUT
            echo "$missing" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_missing_images=false" >> $GITHUB_OUTPUT
            echo "All image references valid"
          fi

      - name: Check for large files in PR
        id: check-size
        run: |
          echo "Checking for large files..."
          large_files=$(find documents images -type f -size +5M 2>/dev/null | head -20 || echo "")

          if [ -n "$large_files" ]; then
            echo "has_large_files=true" >> $GITHUB_OUTPUT
            echo "large_files<<EOF" >> $GITHUB_OUTPUT
            echo "$large_files" | while read file; do
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null)
              size_mb=$(echo "scale=2; $size / 1048576" | bc)
              echo "- \`$file\` (${size_mb} MB)"
            done >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_large_files=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate AUTO section markers
        id: check-markers
        run: |
          echo "Checking AUTO section markers..."
          errors=""

          for section in PUBLICATIONS NEWS; do
            start_count=$(grep -c "<!-- AUTO:${section}:START -->" index.html || true)
            end_count=$(grep -c "<!-- AUTO:${section}:END -->" index.html || true)

            if [ "$start_count" -ne 1 ] || [ "$end_count" -ne 1 ]; then
              errors="${errors}- Section \`${section}\`: START=${start_count}, END=${end_count} (expected 1 each)"$'\n'
            fi
          done

          if [ -n "$errors" ]; then
            echo "has_marker_errors=true" >> $GITHUB_OUTPUT
            echo "marker_errors<<EOF" >> $GITHUB_OUTPUT
            echo "$errors" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_marker_errors=false" >> $GITHUB_OUTPUT
            echo "All section markers valid"
          fi

      - name: Create PR comment
        if: >-
          steps.check-pdfs.outputs.has_missing_pdfs == 'true' ||
          steps.check-images.outputs.has_missing_images == 'true' ||
          steps.check-markers.outputs.has_marker_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            let body = `## PR Validation Results\n\n`;

            if ('${{ steps.check-pdfs.outputs.has_missing_pdfs }}' === 'true') {
              body += `### Missing PDFs\n\n${{ steps.check-pdfs.outputs.missing_pdfs }}\n\n`;
            }

            if ('${{ steps.check-images.outputs.has_missing_images }}' === 'true') {
              body += `### Missing Images\n\n${{ steps.check-images.outputs.missing_images }}\n\n`;
            }

            if ('${{ steps.check-markers.outputs.has_marker_errors }}' === 'true') {
              body += `### Section Marker Errors\n\n${{ steps.check-markers.outputs.marker_errors }}\n\n`;
            }

            body += `<sub>Generated by GitHub Actions</sub>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Generate summary
        if: always()
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for check in pdfs images markers; do
            case $check in
              pdfs) label="PDF References"; has_var="${{ steps.check-pdfs.outputs.has_missing_pdfs }}" ;;
              images) label="Image References"; has_var="${{ steps.check-images.outputs.has_missing_images }}" ;;
              markers) label="Section Markers"; has_var="${{ steps.check-markers.outputs.has_marker_errors }}" ;;
            esac

            if [ "$has_var" == "true" ]; then
              echo "- :x: **${label}:** Issues found" >> $GITHUB_STEP_SUMMARY
            else
              echo "- :white_check_mark: **${label}:** OK" >> $GITHUB_STEP_SUMMARY
            fi
          done
