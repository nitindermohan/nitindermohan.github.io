    <body style="text-align: center; background-color: #6d7993; color: white; vertical-align: middle; margin: auto; position: relative; margin: 80px;">
        <div style="font-size: 500%">
            My site has found a new
        </div>
        <a href="https://www.nitindermohan.com" style="text-decoration: none; color:inherit">
        <i class="fa fa-home fa-5x"> </i>
        </a>
        <div style="font-size: 500%; margin-bottom: 2.0em; margin-top: 1.0em">
            Redirecting you in <div id="counter">10</div> seconds.
        </div>
        <script>
            setInterval(function () {
                var div = document.querySelector("#counter");
                var count = div.textContent * 1 - 1;
                div.textContent = count;
                if (count <= 0) {
                    window.location.replace("https://www.nitindermohan.com");
                }
            }, 1000);
        </script>
    </body>
